
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독서 활동 기록장</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f5f3ff;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #6d5cae;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .hint {
            margin-top: 6px;
            font-size: 13px;
            color: #999;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #8b78c6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #7460b0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📚 독서 활동 기록장</h1>
        <p class="subtitle">오늘 읽은 책과 생각을 기록해 보세요.</p>

        <form
            method="POST"
            action="https://script.google.com/macros/s/AKfycbzsq5ToumZ__wgLlffj4sEoKmwj4b0eXHNkvk_YUGQA4CY3Pg_LY_mstvTMZEgdfg_a/exec"
        >

            <!-- 책 제목 -->
            <label for="bookTitle">책 제목</label>
            <input
                type="text"
                id="bookTitle"
                name="bookTitle"
                placeholder="책 제목을 입력하세요."
            >
            <p class="hint">책 제목을 입력해 주세요.</p>

            <!-- 독서 시간 -->
            <label for="readingMinutes">독서 시간(분)</label>
            <input
                type="number"
                id="readingMinutes"
                name="readingMinutes"
                min="1"
                max="180"
                step="1"
                placeholder="독서 시간을 입력하세요."
            >
            <p class="hint">독서 시간은 1~180 사이의 정수로 입력해 주세요.</p>

            <!-- 한 줄 감상 -->
            <label for="review">한 줄 감상</label>
            <textarea
                id="review"
                name="review"
                placeholder="책을 읽고 느낀 점을 작성하세요."
            ></textarea>

            <p class="hint">책을 읽고 느낀 점을 10~100자로 작성해 주세요.</p>
            <p id="charCount" class="hint">현재 0/100</p>

            <!-- 저장 버튼 -->
            <button type="submit">기록 저장</button>

        </form>

    </div>

    <script>

        const form = document.querySelector("form");

        const bookTitleInput = document.getElementById("bookTitle");
        const readingMinutesInput = document.getElementById("readingMinutes");
        const reviewInput = document.getElementById("review");
        const charCount = document.getElementById("charCount");


        // F3: 글자 수 실시간 표시
        reviewInput.addEventListener("input", function() {

            const length = reviewInput.value.length;

            charCount.textContent = "현재 " + length + "/100";

        });


        // 기록 저장 전 입력값 검사
        form.addEventListener("submit", function(event) {

            const bookTitle = bookTitleInput.value;
            const readingMinutes = readingMinutesInput.value;
            const review = reviewInput.value;


            // F1: 책 제목 공란 및 공백 검사
            if (bookTitle.trim() === "") {

                event.preventDefault();

                alert("책 제목을 입력해 주세요.");

                return;
            }


            // F1: 독서 시간 미입력 검사
            if (readingMinutes.trim() === "") {

                event.preventDefault();

                alert("독서 시간을 입력해 주세요.");

                return;
            }


            // F1: 한 줄 감상 공란 및 공백 검사
            if (review.trim() === "") {

                event.preventDefault();

                alert("한 줄 감상을 입력해 주세요.");

                return;
            }


            // F2: 독서 시간 정수 및 범위 검사
            const minutes = Number(readingMinutes);

            if (
                !Number.isInteger(minutes) ||
                minutes < 1 ||
                minutes > 180
            ) {

                event.preventDefault();

                alert("독서 시간은 1~180 사이의 정수로 입력해 주세요.");

                return;
            }


            // F3: 감상 글자 수 검사
            const reviewLength = review.length;

            if (
                reviewLength < 10 ||
                reviewLength > 100
            ) {

                event.preventDefault();

                alert("한 줄 감상은 10~100자로 입력해 주세요.");

                return;
            }

        });

    </script>

</body>
</html>
